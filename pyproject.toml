[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "Multi-agent QA governance dashboard for LLM agents, built with LangGraph and the Claude API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3.0",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agentaudit = "agentaudit.__main__:main"

[tool.setuptools.packages.find]
include = ["agentaudit*"]

[tool.setuptools.package-data]
agentaudit = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
